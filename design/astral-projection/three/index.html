<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080c18"><title>Breeze · Astral journeys</title>
<script type="importmap">{"imports":{"three":"../../promo-film/three/node_modules/three/build/three.module.js","three/addons/":"../../promo-film/three/node_modules/three/examples/jsm/"}}</script>

<body><main>
<header><a href="./index.html" class="brand">✳ &nbsp; BREEZE</a><span class="eyebrow">ASTRAL JOURNEYS / SIX MOTION STUDIES</span></header>
<div class="intro"><h1>Still body. <em>A new perspective.</em></h1><p>Let awareness do the moving.</p></div>
<nav id="exercise-cards" aria-label="Choose an exercise"></nav>
<section class="stage" aria-label="Exercise animation">
<canvas aria-label="A resting person in a dim bedroom, awareness pathways and a translucent astral double"></canvas><div class="vignette"></div>
<div class="stage-top"><div><span class="eyebrow" id="scene-index"></span><h2 id="scene-title"></h2></div><span id="camera-name" class="camera-badge"></span></div>
<div class="legend"><span>● Physical body</span><span>● Awareness / double</span></div>
<div class="stage-bottom"><span class="eyebrow" id="phase-index"></span><div id="phase"></div><p id="motion"></p></div>
<div class="breath">BREATHE <span id="breath-symbol">◯</span> RELEASE</div>
</section>
<section class="player">
<div class="transport"><button id="play" class="primary">Play</button><button id="highlights" aria-pressed="false">Watch highlights</button><button id="technique" class="quiet">Jump to technique ↗</button><button id="restart" title="Restart session" aria-label="Restart session">↺</button><output id="clock"></output></div>
<label class="sr-only" for="seek">Session time</label><input id="seek" type="range" min="0" value="0" step="0.1"><div id="markers"></div>
<div class="settings"><label>Exercise <select id="exercise"></select></label><label>Speed <select id="speed"><option value="1">1×</option><option value="10">10×</option><option value="60">60× review</option></select></label><label>Camera <select id="camera"><option value="directed">Cinematic</option><option value="steady">Steady</option></select></label><label>Detail <select id="quality"><option value="high">Full</option><option value="phone">Phone</option></select></label><span id="status"></span></div>
</section>
<section class="caption"><div class="caption-heading"><span class="eyebrow" id="cue-number"></span><span class="rule"></span><span>THE GUIDE</span></div><p id="caption" aria-live="polite"></p></section>
<footer>Guided imagery and body awareness. Keep the physical body supported. Return to ordinary breathing whenever you need to.</footer>
</main><script type="module" src="src/main.js"></script></body></html>
