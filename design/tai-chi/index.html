<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tai Chi Studio</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<style>
:root {
  --bg: #f1ece0;
  --panel: #faf7f0;
  --panel-2: #f3eee3;
  --ink: #2e3a33;
  --muted: #6f776f;
  --line: #ddd5c4;
  --accent: #5f8a64;
  --accent-ink: #ffffff;
  --left: #3b8f87;
  --right: #d0714f;
  --warn: #b5562f;
  --shadow: 0 1px 2px rgba(40, 40, 30, 0.08), 0 6px 20px rgba(40, 40, 30, 0.06);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #141c22;
  --panel: #1a242b;
  --panel-2: #212d35;
  --ink: #e6ece8;
  --muted: #9aa8a2;
  --line: #2c3a43;
  --accent: #86b48a;
  --accent-ink: #10181c;
  --left: #5cc0b5;
  --right: #f0936f;
  --warn: #f0936f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.4 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 30px; }
.brand { padding: 4px 8px 14px; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.module { margin-top: 10px; }
.module > h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.9px; color: var(--muted); margin: 14px 8px 6px; }
.lesson { border-radius: 10px; margin: 2px 0; }
.lesson > summary { list-style: none; cursor: pointer; padding: 7px 8px; border-radius: 8px; display: flex; gap: 8px; align-items: baseline; }
.lesson > summary::-webkit-details-marker { display: none; }
.lesson > summary:hover { background: var(--panel-2); }
.lesson > summary .name { font-weight: 600; }
.lesson > summary .sub { color: var(--muted); font-size: 12.5px; }
.lesson[open] > summary { background: var(--panel-2); }
.entries { padding: 4px 0 8px 8px; }
.entry { padding: 5px 8px; border-radius: 8px; }
.entry .title { display: block; font-size: 13px; cursor: pointer; }
.entry .title:hover { color: var(--accent); }
.entry.active-row { background: var(--panel-2); }
.versions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.main { position: relative; display: grid; grid-template-rows: 1fr auto; min-width: 0; }
.viewport { position: relative; overflow: hidden; }
canvas#view { width: 100%; height: 100%; display: block; }
canvas#view.mirrored { transform: scaleX(-1); }
.hud-top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud-title { background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: 12px; padding: 9px 13px; box-shadow: var(--shadow); max-width: 46%; pointer-events: auto; }
.hud-title .lesson-name { color: var(--muted); font-size: 12px; }
.hud-title .move-name { font-weight: 650; font-size: 16px; }
.hud-title .version { color: var(--accent); font-size: 12.5px; font-weight: 600; }
.toolbar { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: auto; }
.group { display: flex; gap: 2px; background: color-mix(in srgb, var(--panel) 90%, transparent); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); }
.group button { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.group button:hover { color: var(--ink); background: var(--panel-2); }
.group button.on { background: var(--accent); color: var(--accent-ink); }
.cue { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: min(720px, 80%);
  background: color-mix(in srgb, var(--panel) 92%, transparent); border-radius: 14px; padding: 10px 18px; font-size: 17px; text-align: center; box-shadow: var(--shadow); transition: opacity 0.3s; }
.cue .step { color: var(--muted); font-size: 12px; display: block; margin-bottom: 2px; }
.cue:empty { opacity: 0; }
.weight { position: absolute; left: 14px; bottom: 22px; background: color-mix(in srgb, var(--panel) 90%, transparent); border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow); width: 170px; }
.weight .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.weight .bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--line); }
.weight .bar .l { background: var(--left); }
.weight .bar .r { background: var(--right); }
.weight .numbers { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.checks { position: absolute; right: 14px; bottom: 22px; width: 300px; max-height: 45%; overflow: auto; background: color-mix(in srgb, var(--panel) 95%, transparent); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12.5px; }
.checks h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.checks .ok { color: var(--accent); }
.checks .bad { color: var(--warn); }
.checks ul { margin: 0; padding: 0; list-style: none; }
.checks li { padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; }
.checks li:hover { color: var(--accent); }
.checks .time { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 6px; }
.checks.hidden { display: none; }
.transport { display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.transport .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-size: 15px; flex: none; }
.transport .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; width: 104px; text-align: center; flex: none; }
.track { position: relative; flex: 1; height: 40px; cursor: pointer; user-select: none; }
.track .lane { position: absolute; left: 0; right: 0; top: 16px; height: 8px; background: var(--line); border-radius: 4px; }
.track .seg { position: absolute; top: 0; height: 14px; font-size: 10.5px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 1px solid var(--line); padding-left: 3px; }
.track .fill { position: absolute; left: 0; top: 16px; height: 8px; background: var(--accent); border-radius: 4px; opacity: 0.55; }
.track .tick { position: absolute; top: 26px; width: 1px; height: 6px; background: var(--muted); opacity: 0.45; }
.track .head { position: absolute; top: 11px; width: 4px; height: 18px; border-radius: 2px; background: var(--accent); transform: translateX(-2px); }
.transport select, .transport .small { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 5px 7px; font-size: 12.5px; cursor: pointer; }
.transport .small.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
body.render .sidebar, body.render .transport, body.render .toolbar, body.render .checks { display: none; }
body.render .app { grid-template-columns: 1fr; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Tai Chi · Yang 24-form</h1>
      <p>Inner Breeze course studio: animation review</p>
    </div>
    <nav id="outline"></nav>
  </aside>
  <section class="main">
    <div class="viewport" id="viewport">
      <canvas id="view"></canvas>
      <div class="hud-top">
        <div class="hud-title" id="hud-title"></div>
        <div class="toolbar">
          <div class="group" id="views"></div>
          <div class="group" id="figures"></div>
          <div class="group" id="toggles"></div>
        </div>
      </div>
      <div class="weight" id="weight">
        <div class="label"><span>Left</span><span>Weight</span><span>Right</span></div>
        <div class="bar"><div class="l" id="weight-l"></div><div class="r" id="weight-r"></div></div>
        <div class="numbers"><span id="weight-ln"></span><span id="weight-rn"></span></div>
      </div>
      <div class="cue" id="cue"></div>
      <div class="checks hidden" id="checks"></div>
      <div class="loading" id="loading">Loading…</div>
    </div>
    <div class="transport">
      <button class="play" id="play" title="Play / pause (Space)">▶</button>
      <div class="time" id="time">0:00.0 / 0:00</div>
      <div class="track" id="track"></div>
      <select id="speed" title="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button class="small on" id="loop" title="Loop">Loop</button>
    </div>
  </section>
</div>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
