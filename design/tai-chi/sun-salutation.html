<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Salutation Body Lab</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<style>
:root { --bg: #f1ece0; --ink: #2e3a33; --line: #ddd5c4; --panel: #faf7f0; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
#view { display: block; width: 100%; height: calc(100% - 52px); }
body.render #view { height: 100%; }
body.render #bar { display: none; }
#bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
#scrub { flex: 1; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="bar">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="150" step="0.033" value="0">
  <span id="time">0.00 s</span>
  <button data-camera="app">App camera</button>
  <button data-camera="side">Side</button>
  <button data-camera="back">Back</button>
  <button data-camera="front">Front</button>
  <button data-camera="orbit">Orbit</button>
</div>
<script>
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render')
</script>
<script type="module" src="./src/sun-salutation-lab.js"></script>
</body>
</html>
