[package]
name = "Inbe"
entry = "src/main.zi"
module_roots = ["src", "src/apps", "src/app", "src/core", "src/habits", "src/practices", "src/practices/whm", "src/practices/meditation", "src/screens", "src/screens/settings", "src/storage", "src/platform", "src/platform/android", "apps/practice"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "7e56396c5c9d6519091d7151fcc6683e3944689e"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "43e6ea3d76ded207e2be93ff82b2a609c3cfeb91"

# Ogg Opus for Ziran's std audio, at the commit Kryon locks.
[dependencies.audio]
git = "https://github.com/ziranlang/audio.git"
ref = "1b2f35b7b39df6fb9af7a52324b4b7cf18e98df2"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
