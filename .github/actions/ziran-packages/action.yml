name: Fetch Ziran packages
description: >
  Fetch the packages pinned in ziran.lock. The built Ziran compiler and the
  package checkouts are cached by the lock's hash, so a job only rebuilds and
  clones when a dependency actually changes.

runs:
  using: composite
  steps:
    - name: Restore the Ziran toolchain and package sources
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ziran/sources
          build/ziran-bootstrap
          build/ziran-toolchain
        key: ziran-${{ env.ImageOS }}-${{ runner.arch }}-${{ hashFiles('ziran.lock') }}
        restore-keys: |
          ziran-${{ env.ImageOS }}-${{ runner.arch }}-

    - name: Fetch Ziran packages
      shell: sh
      run: sh scripts/packages.sh --locked
