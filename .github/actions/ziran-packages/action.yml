name: Fetch Ziran packages
description: >
  Fetch the packages pinned in ziran.lock. The built Ziran compiler is cached
  by the toolchain commit alone, so bumping another package such as Kryon
  keeps it; the package checkouts are cached by the whole lock and fall back
  to the previous checkouts, so a bump fetches only what changed.

inputs:
  save-toolchain:
    description: >
      Save the built compiler to the cache. A job that only fetches packages
      must not, or it would store a toolchain cache without the compiler.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read the Ziran toolchain commit
      id: toolchain
      shell: sh
      run: |
        commit=$(python3 -c 'import json; print(json.load(open("ziran.lock"))["toolchain"]["commit"])')
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Restore the Ziran toolchain
      if: inputs.save-toolchain == 'true'
      uses: actions/cache@v4
      with:
        path: |
          build/ziran-bootstrap
          build/ziran-toolchain
        key: ziran-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.commit }}
        restore-keys: |
          ziran-toolchain-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore the Ziran toolchain without saving it
      if: inputs.save-toolchain != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          build/ziran-bootstrap
          build/ziran-toolchain
        key: ziran-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.commit }}
        restore-keys: |
          ziran-toolchain-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore the package sources
      uses: actions/cache@v4
      with:
        path: ~/.cache/ziran/sources
        key: ziran-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ziran.lock') }}
        restore-keys: |
          ziran-sources-${{ runner.os }}-${{ runner.arch }}-

    - name: Fetch Ziran packages
      shell: sh
      run: sh scripts/packages.sh --locked
