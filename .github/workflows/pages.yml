name: Refresh Gitea Pages after release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]

permissions: {}

jobs:
  refresh-gitea-after-release:
    name: Refresh Gitea Pages after a successful release
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the current Gitea master workflow
        env:
          BREEZE_PAGES_DISPATCH_TOKEN: ${{ secrets.BREEZE_PAGES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BREEZE_PAGES_DISPATCH_TOKEN" ]; then
            echo '::warning::BREEZE_PAGES_DISPATCH_TOKEN is missing'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: token $BREEZE_PAGES_DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"ref":"master"}' \
            'https://git.waozi.xyz/api/v1/repos/waozi/breeze/actions/workflows/pages.yml/dispatches'
