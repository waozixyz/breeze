name: Publish OpenStore

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact committed source to build (defaults to the selected ref)
        required: false
        type: string
      build_only:
        description: Verify and archive the package without publishing it
        type: boolean
        default: false
      changelog:
        description: Changelog text for the OpenStore revision
        required: false
        default: ""
      channel:
        description: OpenStore channel
        required: false
        default: focal
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The published focal channel must use Focal's ARM64 libc and libraries.
    container: clickable/ci-20.04-arm64@sha256:c6227ffcdb2abb50101a8469dd2a8df3ffd9208e04a3e07e351db63d36bec5d6
    defaults:
      run:
        shell: bash
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive
      # Ziran runs on the builder; only Click artifacts use the cross compiler.
      CC: gcc
      CXX: g++
      OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
      OPENSTORE_APP_ID: inbe
      OPENSTORE_CHANNEL: ${{ github.event.inputs.channel || 'focal' }}
      CHANGELOG: ${{ github.event.inputs.changelog || github.event.release.name || github.event.release.tag_name || '' }}

    steps:
      - name: Require an immutable source
        env:
          CANDIDATE: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact commit is required'; exit 1; }

      - name: Install the Focal build environment
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils-aarch64-linux-gnu ca-certificates ccache \
            click curl gcc-aarch64-linux-gnu git git-lfs jq make patchelf \
            pkg-config tcl xz-utils zlib1g-dev libbz2-1.0 libffi7 liblzma5 \
            libsqlite3-0 libssl1.1 \
            libdrm-dev:arm64 libegl1-mesa-dev:arm64 libgbm-dev:arm64 \
            libgles2-mesa-dev:arm64 libsdl2-dev:arm64 libssl-dev:arm64 zlib1g-dev:arm64

      - name: Set up build Python for Focal
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Last upstream Actions build that supports Ubuntu 20.04.
          python-version: '3.12.10'

      - name: Install current build tools
        run: python3 -m pip install cmake==3.28.4 fonttools==4.58.5

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Fetch Ziran packages
        uses: ./.github/actions/ziran-packages

      - name: Scan Tracked Files and History
        run: |
          set -euo pipefail
          python3 scripts/check-secrets.py --working-tree
          python3 scripts/check-secrets.py --history

      - name: Build Click package
        run: |
          set -euo pipefail
          # Absolute paths: CMake cross builds do not resolve bare tool names
          # (CMAKE_AR=aarch64-linux-gnu-ar ends up NOTFOUND and the liboqs
          # archive step fails with "No such file or directory").
          export AARCH64_CC="$(command -v aarch64-linux-gnu-gcc)"
          export AARCH64_AR="$(command -v aarch64-linux-gnu-ar)"
          export AARCH64_RANLIB="$(command -v aarch64-linux-gnu-ranlib)"
          export AARCH64_PKG_CONFIG_PATH=/opt/sdl/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR="$AARCH64_PKG_CONFIG_PATH"
          export AARCH64_RAY_SDL_CFLAGS="$(pkg-config --cflags sdl2)"
          export AARCH64_RAY_SDL_LDLIBS="$(pkg-config --libs sdl2)"
          export AARCH64_RAY_GL_CFLAGS="$(pkg-config --cflags libdrm gbm egl glesv2)"
          export AARCH64_RAY_GL_LDLIBS="$(pkg-config --libs libdrm gbm egl glesv2)"
          export AARCH64_RAY_CFLAGS="$AARCH64_RAY_SDL_CFLAGS $AARCH64_RAY_GL_CFLAGS"
          export AARCH64_RAY_LDLIBS="$AARCH64_RAY_SDL_LDLIBS $AARCH64_RAY_GL_LDLIBS"
          export AARCH64_RAY_SDL_INCLUDE_DIR="$(pkg-config --variable=includedir sdl2)/SDL2"
          export AARCH64_CLICK_RUNTIME_LIBS="$(pkg-config --variable=libdir sdl2)/libSDL2-2.0.so.0 /usr/lib/aarch64-linux-gnu/libssl.so.1.1 /usr/lib/aarch64-linux-gnu/libcrypto.so.1.1 /usr/lib/aarch64-linux-gnu/libdrm.so.2 /usr/lib/aarch64-linux-gnu/libgbm.so.1 /usr/lib/aarch64-linux-gnu/libEGL.so.1 /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libz.so.1"
          make CLICK_ARCH=arm64 click
          python3 scripts/check-click-abi.py build/dist/click/*.click

      - name: Show package contents
        run: |
          set -euo pipefail
          click_file="$(ls -t build/dist/click/*.click | head -1)"
          echo "Built $click_file"
          dpkg-deb --contents "$click_file" | grep -E 'manifest.json|inbe.png|metainfo|inbe.desktop'

      - name: Archive the verified package source and digest
        run: |
          mkdir -p build/release/openstore
          cp build/dist/click/*.click build/release/openstore/
          git rev-parse HEAD > build/release/openstore/source-commit.txt
          cd build/release/openstore
          sha256sum *.click > SHA256SUMS

      - name: Preserve Click artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstore-click
          path: build/release/openstore/*
          if-no-files-found: error

      - name: Publish to OpenStore
        if: ${{ !inputs.build_only }}
        run: |
          set -euo pipefail
          click_file="$(ls -t build/dist/click/*.click | head -1)"
          scripts/publish-openstore.sh "$click_file"
