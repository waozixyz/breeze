name: Publish OpenStore

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact committed source to build (defaults to the selected ref)
        required: false
        type: string
      build_only:
        description: Verify and archive the package without publishing it
        type: boolean
        default: false
      changelog:
        description: Changelog text for the OpenStore revision
        required: false
        default: ""
      channel:
        description: OpenStore channel
        required: false
        default: focal
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The published focal channel must use Focal's ARM64 libc and libraries.
    container: clickable/ci-20.04-arm64@sha256:c6227ffcdb2abb50101a8469dd2a8df3ffd9208e04a3e07e351db63d36bec5d6
    defaults:
      run:
        shell: bash
    timeout-minutes: 90

    env:
      DEBIAN_FRONTEND: noninteractive
      # Ziran runs on the builder; only Click artifacts use the cross compiler.
      CC: gcc
      CXX: g++
      OPENSTORE_APP_ID: inbe
      OPENSTORE_CHANNEL: ${{ github.event.inputs.channel || 'focal' }}
      CHANGELOG: ${{ github.event.inputs.changelog || github.event.release.name || github.event.release.tag_name || '' }}

    steps:
      - name: Require an immutable source
        env:
          CANDIDATE: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact commit is required'; exit 1; }

      - name: Install the Focal build environment
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils-aarch64-linux-gnu ca-certificates ccache \
            click curl gcc-aarch64-linux-gnu git git-lfs jq make patchelf \
            perl pkg-config tcl xz-utils zlib1g-dev libbz2-1.0 libffi7 liblzma5 \
            libsqlite3-0 libssl-dev \
            libdrm-dev:arm64 libegl1-mesa-dev:arm64 libgbm-dev:arm64 \
            libgles2-mesa-dev:arm64 libsdl2-dev:arm64 libssl-dev:arm64 zlib1g-dev:arm64
          apt-get install -y --no-install-recommends libwayland-bin \
            libwayland-dev:arm64 libxkbcommon-dev:arm64 libpulse-dev:arm64 libdbus-1-dev:arm64

      - name: Set up build Python for Focal
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Last upstream Actions build that supports Ubuntu 20.04.
          python-version: '3.12.10'

      - name: Install current build tools
        run: |
          # The project uses GNU Make 4.3+ function/comment parsing.
          python3 -m pip install cmake==3.28.4 fonttools==4.58.5 gnumake==4.4.1
          make --version

      - name: Build Focal TLS libraries
        run: |
          set -euo pipefail
          # The locked Curl requires OpenSSL 3. Build its current LTS for
          # Focal instead of importing a newer distribution's libc.
          tls_source="$RUNNER_TEMP/inbe-openssl"
          mkdir -p "$tls_source"
          curl --fail --location --retry 3 \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz \
            --output "$tls_source/source.tar.gz"
          printf '%s  %s\n' \
            603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a \
            "$tls_source/source.tar.gz" | sha256sum --check -
          tar -xzf "$tls_source/source.tar.gz" -C "$tls_source"
          cd "$tls_source/openssl-3.5.9"
          ./Configure linux-aarch64 --cross-compile-prefix=aarch64-linux-gnu- \
            --prefix=/opt/inbe-openssl --libdir=lib --openssldir=/etc/ssl shared no-tests
          make -j2 build_sw
          make install_sw

      - name: Build Focal SDL with Wayland
        run: |
          set -euo pipefail
          sdl_source="$RUNNER_TEMP/inbe-sdl2"
          mkdir -p "$sdl_source"
          curl --fail --location --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz \
            --output "$sdl_source/source.tar.gz"
          printf '%s  %s\n' \
            5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165 \
            "$sdl_source/source.tar.gz" | sha256sum --check -
          tar -xzf "$sdl_source/source.tar.gz" -C "$sdl_source"
          unset PKG_CONFIG_PATH
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          cmake_bin="$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR + "/cmake")')"
          "$cmake_bin" -S "$sdl_source/SDL2-2.32.10" -B "$sdl_source/build" \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc \
            -DCMAKE_INSTALL_PREFIX=/opt/inbe-sdl2 -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF \
            -DSDL_WAYLAND=ON -DSDL_WAYLAND_SHARED=ON -DSDL_WAYLAND_LIBDECOR=OFF \
            -DSDL_X11=OFF -DSDL_KMSDRM=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON \
            -DSDL_PULSEAUDIO=ON -DSDL_ALSA=OFF
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' "$sdl_source/build/include/SDL_config.h"
          "$cmake_bin" --build "$sdl_source/build" --parallel 2
          "$cmake_bin" --install "$sdl_source/build"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Fetch Ziran packages
        uses: ./.github/actions/ziran-packages

      - name: Scan Tracked Files and History
        run: |
          set -euo pipefail
          # The SDK container runs under a different UID from the checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z >/dev/null
          python3 scripts/check-secrets.py --working-tree
          python3 scripts/check-secrets.py --history

      - name: Build Click package
        run: |
          set -euo pipefail
          # Absolute paths: CMake cross builds do not resolve bare tool names
          # (CMAKE_AR=aarch64-linux-gnu-ar ends up NOTFOUND and the liboqs
          # archive step fails with "No such file or directory").
          export AARCH64_CC="$(command -v aarch64-linux-gnu-gcc)"
          export AARCH64_AR="$(command -v aarch64-linux-gnu-ar)"
          export AARCH64_RANLIB="$(command -v aarch64-linux-gnu-ranlib)"
          export OPENSSL_ROOT_DIR=/opt/inbe-openssl
          # Cross builds cannot autodetect the device's CA store.
          export CMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/inbe-focal-arm64.cmake"
          cat > "$CMAKE_TOOLCHAIN_FILE" <<'CMAKE'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER /usr/bin/aarch64-linux-gnu-gcc)
          set(OPENSSL_ROOT_DIR /opt/inbe-openssl CACHE PATH "Focal-built TLS")
          set(CURL_CA_BUNDLE /etc/ssl/certs/ca-certificates.crt CACHE FILEPATH "Device CA bundle")
          set(CURL_CA_PATH /etc/ssl/certs CACHE PATH "Device CA directory")
          CMAKE
          unset PKG_CONFIG_PATH
          export AARCH64_PKG_CONFIG_PATH=/opt/inbe-openssl/lib/pkgconfig:/opt/inbe-sdl2/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR="$AARCH64_PKG_CONFIG_PATH"
          export AARCH64_RAY_SDL_CFLAGS="$(pkg-config --cflags sdl2)"
          export AARCH64_RAY_SDL_LDLIBS="$(pkg-config --libs sdl2)"
          export AARCH64_RAY_GL_CFLAGS="$(pkg-config --cflags libdrm gbm egl glesv2)"
          export AARCH64_RAY_GL_LDLIBS="$(pkg-config --libs libdrm gbm egl glesv2)"
          export AARCH64_RAY_CFLAGS="$AARCH64_RAY_SDL_CFLAGS $AARCH64_RAY_GL_CFLAGS"
          # Search bundled TLS and SDL before the SDK's older system copies.
          export AARCH64_RAY_LDLIBS="-L/opt/inbe-openssl/lib $AARCH64_RAY_SDL_LDLIBS $AARCH64_RAY_GL_LDLIBS"
          export AARCH64_RAY_SDL_INCLUDE_DIR="$(pkg-config --variable=includedir sdl2)/SDL2"
          click_curl_dir="$PWD/vendor-builds/click/arm64/curl"
          export AARCH64_KRYON_CURL_CFLAGS="-DCURL_STATICLIB -I$click_curl_dir/include"
          export AARCH64_KRYON_CURL_LDLIBS="$click_curl_dir/lib/libcurl.a -L/opt/inbe-openssl/lib -lssl -lcrypto -lz -lpthread"
          export AARCH64_CLICK_RUNTIME_LIBS="$(pkg-config --variable=libdir sdl2)/libSDL2-2.0.so.0 /opt/inbe-openssl/lib/libssl.so.3 /opt/inbe-openssl/lib/libcrypto.so.3 /usr/lib/aarch64-linux-gnu/libdrm.so.2 /usr/lib/aarch64-linux-gnu/libgbm.so.1 /usr/lib/aarch64-linux-gnu/libEGL.so.1 /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libz.so.1"
          # Make otherwise prefers the SDK's older /usr/bin/cmake.
          export CMAKE="$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR + "/cmake")')"
          "$CMAKE" --version
          make CMAKE="$CMAKE" LDFLAGS="-Wl,--gc-sections -s -L/opt/inbe-openssl/lib" CLICK_ARCH=arm64 click
          python3 scripts/check-click-abi.py build/dist/click/*.click

      - name: Show package contents
        run: |
          set -euo pipefail
          click_file="$(ls -t build/dist/click/*.click | head -1)"
          echo "Built $click_file"
          dpkg-deb --contents "$click_file" | grep -E 'manifest.json|inbe.png|metainfo|inbe.desktop'

      - name: Archive the verified package source and digest
        run: |
          mkdir -p build/release/openstore
          cp build/dist/click/*.click build/release/openstore/
          git rev-parse HEAD > build/release/openstore/source-commit.txt
          cd build/release/openstore
          sha256sum *.click > SHA256SUMS

      - name: Preserve Click artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstore-click
          path: build/release/openstore/*
          if-no-files-found: error

      - name: Publish to OpenStore
        if: ${{ !inputs.build_only }}
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/check-version.py --print-version)"
          python3 scripts/check-phone-check.py "$version" --revision "$(git rev-parse HEAD)"
          click_file="$(ls -t build/dist/click/*.click | head -1)"
          scripts/publish-openstore.sh "$click_file"
