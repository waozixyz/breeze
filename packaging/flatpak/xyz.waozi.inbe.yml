app-id: xyz.waozi.inbe
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: inbe
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
modules:
  - name: inbe
    buildsystem: simple
    build-commands:
      - make vendor-prebuilds-native
      - make native
      - install -D -m755 "$(find build/bin/linux -maxdepth 1 -type f -name 'inbe-linux-*' | head -n 1)" /app/bin/inbe
      - install -D -m644 packaging/linux/appimage/inbe.desktop /app/share/applications/xyz.waozi.inbe.desktop
      - sed -i 's/^Icon=.*/Icon=xyz.waozi.inbe/' /app/share/applications/xyz.waozi.inbe.desktop
      - install -D -m644 packaging/linux/appimage/inbe.png /app/share/icons/hicolor/512x512/apps/xyz.waozi.inbe.png
      - install -D -m644 packaging/linux/appimage/inbe.appdata.xml /app/share/metainfo/xyz.waozi.inbe.metainfo.xml
    sources:
      - type: dir
        path: ../..
