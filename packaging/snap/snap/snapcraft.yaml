name: inbe
title: Inner Breeze
summary: Syncable breathing, meditation, and habit practice app
description: |
  Inner Breeze is a free, open-source practice app for breathing,
  meditation, and habit tracking with visual and audio cues, meditation
  timers, habit counters, session history, and optional sync.

version: '2.1.20'
license: BSD-3-Clause
base: core22
confinement: strict
grade: stable

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  inbe:
    command: bin/inbe
    desktop: gui/inbe.desktop
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/pulseaudio:$LD_LIBRARY_PATH
      DISABLE_WAYLAND: 1
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - pulseaudio
      - alsa
      - network
      - home

parts:
  desktop-glib:
    plugin: nil
    stage-packages:
      - libglib2.0-0

  sdl2-runtime:
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libsdl2-image-2.0-0
      - libsdl2-ttf-2.0-0
      - libgl1-mesa-glx
      - libgl1-mesa-dri
      - libgles2-mesa
      - libgtk-3-0
      - libdrm2
      - libgbm1
      - libegl1-mesa
      - libxkbcommon0
      - libpulse0
      - libasound2
      - libasound2-data
      - libasound2-plugins

  sync-runtime:
    plugin: nil
    stage-packages:
      - libcurl4
      - libssl3

  inbe:
    plugin: make
    source: .
    build-packages:
      - build-essential
      - cmake
      - libssl-dev
      - libcurl4-openssl-dev
      - libgtk-3-dev
      - libsdl2-dev
      - libdrm-dev
      - libgbm-dev
      - libegl1-mesa-dev
      - libgles2-mesa-dev
      - pkg-config
      - curl
      - xz-utils
      - python3
      - python3-fonttools
      # Fetches the Ziran packages pinned in ziran.lock.
      - git
    override-build: |
      sh scripts/install-build-node.sh /tmp/inbe-build-node
      export PATH="/tmp/inbe-build-node/bin:$PATH"
      make vendor-prebuilds-native
      make native
      binary="$(find build/bin/linux -maxdepth 1 -type f -name 'inbe-linux-*' | head -n 1)"
      if [ -z "$binary" ]; then
        echo "No Linux binary was produced"
        exit 1
      fi
      install -D -m755 "$binary" $SNAPCRAFT_PART_INSTALL/bin/inbe
      strip $SNAPCRAFT_PART_INSTALL/bin/inbe
    prime:
      - bin/inbe

  gui-assets:
    plugin: dump
    source: packaging/linux/appimage
    organize:
      inbe.desktop: gui/inbe.desktop
      inbe.png: gui/inbe.png
      inbe.appdata.xml: gui/inbe.metainfo.xml
    prime:
      - gui/inbe.desktop
      - gui/inbe.png
      - gui/inbe.metainfo.xml
