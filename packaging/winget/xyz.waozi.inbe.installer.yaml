# Winget installer manifest template for Inner Breeze.
#
# ONE-TIME bootstrap: the first submission to microsoft/winget-pkgs must be
# a new-package PR. Copy this file into a fork of microsoft/winget-pkgs under
# manifests/x/waozi/inbe/<version>/ (adjust PackageVersion and the
# installer hash and url from the release) and open the PR manually. After the
# package is accepted, the publish-winget release job keeps it current
# automatically (needs a WINGET_TOKEN classic PAT with repo scope stored as a
# repo secret); without the secret the job skips silently.

PackageIdentifier: xyz.waozi.inbe
PackageVersion: 1.9.5
PackageName: Inner Breeze
Publisher: waozi
License: MIT
ShortDescription: Breathing, meditation and habits trainer that works offline.
PackageUrl: https://github.com/waozixyz/inbe
PublisherUrl: https://waozi.xyz
Moniker: inbe
Tags:
  - breathing
  - meditation
  - wim-hof
  - habits
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    InstallerUrl: https://github.com/waozixyz/inbe/releases/download/v1.9.5/inbe-windows-setup-1.9.5.exe
    InstallerSha256: REPLACE_WITH_SHA256_OF_SETUP_EXE
    Scope: machine
ManifestType: installer
ManifestVersion: 1.6.0
