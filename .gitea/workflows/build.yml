name: Breeze build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Quick compiles the Linux app. Full also runs the local tests.
        required: true
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

jobs:
  linux:
    name: Linux native
    runs-on: build-breeze
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install Linux build and test dependencies
        run: USER="$(id -un)" .github/scripts/install-apt-packages.sh .github/apt/test-packages.txt ccache
      - name: Fetch locked Ziran packages
        uses: ./.github/actions/ziran-packages
      - name: Restore Linux compiler objects
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ccache
          key: breeze-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ gitea.sha }}
          restore-keys: breeze-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the desktop app
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 200M
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_DIR="$HOME/.cache/ccache"
          make -j2 PACKAGE_FLAGS=--locked native
          ccache --show-stats
      - name: Run the retained local tests
        if: inputs.profile == 'full'
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY HARMONY_DESKTOP_RECOVERY=0 make -j2 PACKAGE_FLAGS=--locked test
