name: Breeze build
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: Quick compiles the Linux app. Full also runs the local tests.
        required: true
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: breeze-build-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux native
    if: gitea.ref == 'refs/heads/master'
    runs-on: build-native-breeze
    timeout-minutes: 60
    env:
      BREEZE_PROFILE: ${{ gitea.event_name == 'push' && 'quick' || inputs.profile }}
    steps:
      - name: Check out the current pushed commit from Build
        id: native
        env:
          BUILD_NATIVE_SOURCE_TOKEN: ${{ github.token }}
        run: /usr/local/libexec/gitea-native-build checkout
      - name: Fetch locked Ziran packages
        if: steps.native.outputs.current == 'true'
        run: /usr/local/libexec/gitea-native-build run sh scripts/packages.sh --locked
      - name: Build the desktop app
        if: steps.native.outputs.current == 'true'
        run: |
          /usr/local/libexec/gitea-native-build run bash -ec '
            make -j"$JOBS" PACKAGE_FLAGS=--locked native
            ccache --show-stats || true
          '
      - name: Run the retained local tests
        if: steps.native.outputs.current == 'true' && env.BREEZE_PROFILE == 'full'
        run: /usr/local/libexec/gitea-native-build run bash -ec 'make -j"$JOBS" PACKAGE_FLAGS=--locked test'
