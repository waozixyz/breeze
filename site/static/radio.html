<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120f">
  <meta name="description" content="A tactile interactive 3D ambient radio.">
  <title>Ambient Radio — 3D control study</title>
  <link rel="icon" href="/icons/mark.png">
  <link rel="stylesheet" href="/assets/radio/radio.css">
</head>
<body>
  <main class="radio-stage">
    <canvas id="radio-canvas" tabindex="0"
      aria-label="Interactive three-dimensional ambient radio. Press the power button, drag the volume knob, or drag the tuning knob."></canvas>
    <p id="radio-live" class="visually-hidden" aria-live="polite">Radio off</p>
    <noscript>This interactive radio needs JavaScript.</noscript>
  </main>
  <script type="module" src="/assets/radio/radio.js"></script>
</body>
</html>
