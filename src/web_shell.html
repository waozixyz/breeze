<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Inner Breeze</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inbe.waozi.xyz/">
    <meta property="og:title" content="Inner Breeze">
    <meta property="og:description" content="guided breathing, meditation, and habit tracking">
    <meta property="og:image" content="https://inbe.waozi.xyz/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://inbe.waozi.xyz/">
    <meta name="twitter:title" content="Inner Breeze">
    <meta name="twitter:description" content="guided breathing, meditation, and habit tracking">
    <meta name="twitter:image" content="https://inbe.waozi.xyz/og.png">
    <meta name="twitter:site" content="@waozixyz">
    <meta name="twitter:creator" content="@waozixyz">
    <link rel="icon" type="image/png" sizes="32x32" href="site-icons/favicon-32x32.png?v=WEB_CACHE_BUSTER">
    <link rel="icon" type="image/png" sizes="192x192" href="site-icons/icon-192x192.png?v=WEB_CACHE_BUSTER">
    <link rel="apple-touch-icon" href="site-icons/apple-touch-icon.png?v=WEB_CACHE_BUSTER">
    <link rel="manifest" href="webmanifest.json?v=WEB_CACHE_BUSTER">
    <meta name="theme-color" content="#e6f1fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#182238" media="(prefers-color-scheme: dark)">
    <style>
      :root {
        --app-background: #e6f1fa;
        --loading-background: radial-gradient(circle at 50% 38%, #ffffff 0%, #e6f1fa 56%, #d8e9fa 100%);
        --loading-ink: #1b2a49;
        --loading-muted: #536b87;
        --loading-track: rgba(53, 91, 149, 0.17);
        --loading-progress: #7299d7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --app-background: #182238;
          --loading-background: radial-gradient(circle at 50% 38%, #314c78 0%, #182238 68%, #11182b 100%);
          --loading-ink: #f7f9ff;
          --loading-muted: #c5d8ed;
          --loading-track: rgba(255, 255, 255, 0.18);
          --loading-progress: #a1c6fa;
        }
      }

      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--app-background);
      }

      .canvas-stage {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        background: var(--app-background);
        color: var(--loading-ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .canvas-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        position: relative;
      }

      canvas.emscripten {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
        background: var(--app-background);
        image-rendering: auto;
      }

      .canvas-frame:fullscreen,
      .canvas-frame:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: var(--loading-background);
        opacity: 1;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      .loading-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-panel {
        width: min(360px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .loading-mark {
        width: 128px;
        height: 128px;
        object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(44, 77, 132, 0.16));
      }

      .loading-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 700;
      }

      #status {
        min-height: 1.35em;
        color: var(--loading-muted);
        font-size: 13px;
        line-height: 1.35;
      }

      #progress {
        width: min(280px, 100%);
        height: 8px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: var(--loading-track);
      }

      #progress::-webkit-progress-bar {
        border-radius: 999px;
        background: var(--loading-track);
      }

      #progress::-webkit-progress-value {
        border-radius: 999px;
        background: var(--loading-progress);
      }

      #progress::-moz-progress-bar {
        border-radius: 999px;
        background: var(--loading-progress);
      }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
      <div class="loading-panel">
        <img class="loading-mark" src="site-icons/icon-192x192.png?v=WEB_CACHE_BUSTER" alt="" width="128" height="128">
        <h1 class="loading-title">Inner Breeze</h1>
        <div id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden></progress>
      </div>
    </div>
    <div class="canvas-stage">
      <div class="canvas-frame" id="canvas-frame">
        <canvas class="emscripten" id="canvas" width="320" height="560" tabindex="-1"></canvas>
      </div>
    </div>

    <script src="index_boot.js?v=WEB_CACHE_BUSTER"></script>
    {{{ APP_SCRIPT }}}
  </body>
</html>
